<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neon-glow-arcade" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="15" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="crt-screen-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cabinet-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cabinet-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="crt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="brass-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <g filter="url(#crt-screen-shadow)" transform="translate(10, 0)">
    <!-- ================= 1. CABINET OUTER STRUCTURE ================= -->
    <!-- Cabinet Main Shell -->
    <polygon points="120,40 370,40 400,90 380,260 410,320 390,480 100,480 80,320 110,260 90,90" fill="url(#cabinet-body)"/>

    <!-- Cabinet Side Art Wings (Neon Synthwave Gradient) -->
    <path d="M 120 40 L 90 90 L 110 260 L 80 320 L 100 480 L 125 480 L 105 325 L 132 265 L 112 95 L 135 45 Z" fill="url(#cabinet-side)"/>
    <path d="M 370 40 L 400 90 L 380 260 L 410 320 L 390 480 L 365 480 L 385 325 L 358 265 L 378 95 L 355 45 Z" fill="url(#cabinet-side)"/>

    <!-- Cabinet Base Feet -->
    <rect x="110" y="475" width="40" height="15" rx="3" fill="#020617"/>
    <rect x="340" y="475" width="40" height="15" rx="3" fill="#020617"/>

    <!-- ================= 2. NEON MARQUEE HEADER ================= -->
    <rect x="130" y="50" width="230" height="45" rx="5" fill="#09090b" stroke="#ec4899" stroke-width="2.5" filter="url(#neon-glow-arcade)"/>
    <rect x="135" y="55" width="220" height="35" rx="3" fill="#18181b"/>
    <!-- Glowing Neon Text / Logo -->
    <text x="245" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="20" fill="#22d3ee" filter="url(#neon-glow-arcade)">ARCADE 90s</text>

    <!-- ================= 3. CRT SCREEN BEZEL & DISPLAY ================= -->
    <!-- CRT Bezel Frame -->
    <rect x="135" y="110" width="220" height="150" rx="15" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    
    <!-- Curved CRT Screen Glass -->
    <rect x="145" y="120" width="200" height="130" rx="12" fill="url(#crt-bg)"/>

    <!-- CRT Scanlines Overlay -->
    <g opacity="0.15">
      <line x1="145" y1="130" x2="345" y2="130" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="145" x2="345" y2="145" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="160" x2="345" y2="160" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="175" x2="345" y2="175" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="190" x2="345" y2="190" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="205" x2="345" y2="205" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="220" x2="345" y2="220" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="145" y1="235" x2="345" y2="235" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- CRT Pixel Graphics Game (Space Shooter / Pixels) -->
    <g filter="url(#neon-glow-arcade)">
      <!-- Player Ship (Cyan Pixel) -->
      <polygon points="245,225 240,235 250,235" fill="#38bdf8"/>
      <rect x="243" y="235" width="4" height="4" fill="#a855f7"/>

      <!-- Enemy Pixels (Pink / Yellow) -->
      <rect x="180" y="140" width="12" height="10" fill="#f43f5e"/>
      <rect x="240" y="135" width="12" height="10" fill="#facc15"/>
      <rect x="295" y="140" width="12" height="10" fill="#f43f5e"/>
      
      <!-- Lasers -->
      <rect x="244" y="170" width="2" height="12" fill="#4ade80"/>
      <rect x="244" y="195" width="2" height="12" fill="#4ade80"/>

      <!-- Score Text -->
      <text x="155" y="136" font-family="monospace" font-weight="bold" font-size="10" fill="#4ade80">1P 02450</text>
      <text x="300" y="136" font-family="monospace" font-weight="bold" font-size="10" fill="#f43f5e">HIGH 9999</text>
    </g>

    <!-- CRT Screen Glass Reflection -->
    <polygon points="145,120 220,120 145,245" fill="#ffffff" opacity="0.08"/>

    <!-- ================= 4. CONTROL PANEL (JOYSTICK & BUTTONS) ================= -->
    <!-- Control Deck Surface (Angled 3D Shelf) -->
    <polygon points="120,265 370,265 395,335 95,335" fill="#27272a" stroke="#52525b" stroke-width="2"/>
    <polygon points="125,270 365,270 388,330 102,330" fill="#18181b"/>

    <!-- Player 1 Joystick (Red Top) -->
    <g filter="url(#crt-screen-shadow)">
      <ellipse cx="170" cy="310" rx="14" ry="8" fill="#09090b"/>
      <line x1="170" y1="310" x2="170" y2="280" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round"/>
      <circle cx="170" cy="276" r="12" fill="#ef4444" filter="url(#neon-glow-arcade)"/>
      <circle cx="166" cy="272" r="3" fill="#ffffff"/>
    </g>

    <!-- Player 2 Joystick (Blue Top) -->
    <g filter="url(#crt-screen-shadow)">
      <ellipse cx="290" cy="310" rx="14" ry="8" fill="#09090b"/>
      <line x1="290" y1="310" x2="290" y2="280" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round"/>
      <circle cx="290" cy="276" r="12" fill="#3b82f6" filter="url(#neon-glow-arcade)"/>
      <circle cx="286" cy="272" r="3" fill="#ffffff"/>
    </g>

    <!-- P1 Action Buttons (Arcade Colors: Yellow, Green, Pink) -->
    <g>
      <ellipse cx="205" cy="295" rx="8" ry="5" fill="#eab308" stroke="#713f12" stroke-width="1.5"/>
      <ellipse cx="222" cy="290" rx="8" ry="5" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
      <ellipse cx="210" cy="310" rx="8" ry="5" fill="#ec4899" stroke="#831843" stroke-width="1.5"/>
    </g>

    <!-- P2 Action Buttons -->
    <g>
      <ellipse cx="325" cy="295" rx="8" ry="5" fill="#eab308" stroke="#713f12" stroke-width="1.5"/>
      <ellipse cx="342" cy="290" rx="8" ry="5" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
      <ellipse cx="330" cy="310" rx="8" ry="5" fill="#ec4899" stroke="#831843" stroke-width="1.5"/>
    </g>

    <!-- 1P / 2P White Start Buttons -->
    <ellipse cx="170" cy="285" rx="5" ry="3" fill="#ffffff"/>
    <ellipse cx="290" cy="285" rx="5" ry="3" fill="#ffffff"/>

    <!-- ================= 5. LOWER CABINET & BRASS COIN DOOR ================= -->
    <!-- Lower Cabinet Panel Base -->
    <rect x="130" y="350" width="230" height="120" rx="5" fill="#18181b" stroke="#27272a" stroke-width="2"/>

    <!-- Speaker Grille Slots -->
    <g opacity="0.6">
      <line x1="150" y1="362" x2="340" y2="362" stroke="#3f3f46" stroke-width="3" stroke-dasharray="8,4"/>
      <line x1="150" y1="370" x2="340" y2="370" stroke="#3f3f46" stroke-width="3" stroke-dasharray="8,4"/>
    </g>

    <!-- Double Brass Coin Door -->
    <rect x="180" y="385" width="130" height="75" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
    
    <!-- Coin Slots 1 & 2 (Brass metallic) -->
    <!-- Left Slot -->
    <rect x="200" y="395" width="35" height="40" rx="3" fill="url(#brass-coin)" stroke="#451a03" stroke-width="1.5"/>
    <rect x="210" y="402" width="15" height="4" fill="#ef4444" filter="url(#neon-glow-arcade)"/>
    <rect x="216" y="412" width="3" height="14" fill="#09090b"/>
    <text x="217" y="432" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffffff">25¢</text>

    <!-- Right Slot -->
    <rect x="255" y="395" width="35" height="40" rx="3" fill="url(#brass-coin)" stroke="#451a03" stroke-width="1.5"/>
    <rect x="265" y="402" width="15" height="4" fill="#ef4444" filter="url(#neon-glow-arcade)"/>
    <rect x="271" y="412" width="3" height="14" fill="#09090b"/>
    <text x="272" y="432" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffffff">25¢</text>

    <!-- Coin Return Pocket -->
    <rect x="220" y="442" width="50" height="12" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  </g>
</svg>
