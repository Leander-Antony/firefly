<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <radialGradient id="robin-body" cx="42%" cy="38%" r="58%">
      <stop offset="0%"  stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </radialGradient>
    <radialGradient id="robin-breast" cx="50%" cy="35%" r="55%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="robin-wing" cx="30%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#92400e"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </radialGradient>
    <radialGradient id="eye-shine" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="blue-body" cx="42%" cy="38%" r="58%">
      <stop offset="0%"  stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="blue-breast" cx="50%" cy="35%" r="55%">
      <stop offset="0%"  stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </radialGradient>
    <radialGradient id="blue-wing" cx="30%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <radialGradient id="finch-body" cx="42%" cy="38%" r="58%">
      <stop offset="0%"  stop-color="#16a34a"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="finch-breast" cx="50%" cy="35%" r="55%">
      <stop offset="0%"  stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <radialGradient id="finch-wing" cx="30%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <filter id="bird-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!--  BIRD 1 — MEADOW ROBIN  (centre x≈200)                          -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(200, 220) scale(1)" filter="url(#soft-shadow)">
    <!-- Tail feathers -->
    <path d="M -10 55 L -28 95 L -8 85 L 0 100 L 8 85 L 28 95 L 10 55 Z"
          fill="#361407" opacity="0.85"/>
    <!-- Wing (left/back) -->
    <ellipse cx="-20" cy="18" rx="34" ry="18" transform="rotate(-18,-20,18)"
             fill="url(#robin-wing)" opacity="0.9"/>
    <!-- Wing primary feather tips -->
    <path d="M -46 22 C -52 38, -48 50, -36 48 C -30 46, -18 30, -8 38"
          fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Main body -->
    <ellipse cx="0" cy="20" rx="42" ry="38" fill="url(#robin-body)"/>
    <!-- Orange-red breast -->
    <ellipse cx="12" cy="24" rx="26" ry="30" fill="url(#robin-breast)"/>
    <!-- Head -->
    <circle cx="16" cy="-28" r="26" fill="url(#robin-body)"/>
    <!-- Eye white ring -->
    <circle cx="26" cy="-34" r="8" fill="#f5f5f5"/>
    <!-- Pupil -->
    <circle cx="27" cy="-34" r="5.5" fill="#0c0a09"/>
    <!-- Eye shine -->
    <circle cx="29" cy="-37" r="2.5" fill="url(#eye-shine)"/>
    <!-- Beak upper -->
    <path d="M 38 -32 L 60 -28 L 38 -22 Z" fill="#ca8a04"/>
    <!-- Beak lower -->
    <path d="M 38 -22 L 58 -20 L 38 -16 Z" fill="#a16207" opacity="0.8"/>
    <!-- Legs -->
    <line x1="-8"  y1="58" x2="-10" y2="90" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="90" x2="-22" y2="100" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="90" x2="-4"  y2="102" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8"  y1="58"  x2="10"  y2="90" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="90"  x2="-2"  y2="102" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="90"  x2="22"  y2="100" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Label -->
  <text x="200" y="380" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold"
        fill="#f97316" letter-spacing="0.5">Meadow Robin</text>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!--  BIRD 2 — STARLIGHT BLUEBIRD  (centre x≈600)                    -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(600, 210) scale(1.08)" filter="url(#soft-shadow)">
    <!-- Tail feathers -->
    <path d="M -10 55 L -28 95 L -8 85 L 0 100 L 8 85 L 28 95 L 10 55 Z"
          fill="#1e3a8a" opacity="0.85"/>
    <!-- Wing back -->
    <ellipse cx="-22" cy="16" rx="36" ry="19" transform="rotate(-16,-22,16)"
             fill="url(#blue-wing)" opacity="0.9"/>
    <!-- Wing feather edge detail -->
    <path d="M -50 20 C -56 36, -52 48, -40 46 C -32 44, -20 28, -8 36"
          fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Star sparkle on wing -->
    <g filter="url(#bird-glow)" transform="translate(-30, 10)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#e0f2fe" opacity="0.9"/>
    </g>
    <!-- Main body -->
    <ellipse cx="0" cy="20" rx="42" ry="38" fill="url(#blue-body)"/>
    <!-- Pale breast -->
    <ellipse cx="12" cy="26" rx="24" ry="28" fill="url(#blue-breast)"/>
    <!-- Head -->
    <circle cx="16" cy="-28" r="26" fill="url(#blue-body)"/>
    <!-- Star marking on forehead -->
    <g filter="url(#bird-glow)" transform="translate(10,-42)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#bae6fd"/>
    </g>
    <!-- Eye -->
    <circle cx="26" cy="-34" r="8" fill="#f0f9ff"/>
    <circle cx="27" cy="-34" r="5.5" fill="#0c1a2e"/>
    <circle cx="29" cy="-37" r="2.5" fill="url(#eye-shine)"/>
    <!-- Beak upper -->
    <path d="M 38 -32 L 62 -26 L 38 -22 Z" fill="#bae6fd"/>
    <path d="M 38 -22 L 60 -18 L 38 -16 Z" fill="#93c5fd" opacity="0.8"/>
    <!-- Legs -->
    <line x1="-8"  y1="58" x2="-10" y2="90" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="90" x2="-22" y2="100" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="90" x2="-4"  y2="102" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8"  y1="58"  x2="10"  y2="90" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="90"  x2="-2"  y2="102" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="90"  x2="22"  y2="100" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Label -->
  <text x="600" y="380" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold"
        fill="#38bdf8" letter-spacing="0.5">Starlight Bluebird</text>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!--  BIRD 3 — FOREST FINCH  (centre x≈1000)                         -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(1000, 218) scale(1.04)" filter="url(#soft-shadow)">
    <!-- Tail feathers -->
    <path d="M -10 55 L -28 95 L -8 85 L 0 100 L 8 85 L 28 95 L 10 55 Z"
          fill="#14532d" opacity="0.85"/>
    <!-- Wing back -->
    <ellipse cx="-20" cy="18" rx="34" ry="18" transform="rotate(-20,-20,18)"
             fill="url(#finch-wing)" opacity="0.9"/>
    <!-- Wing feather edge -->
    <path d="M -46 22 C -52 38, -48 50, -36 48 C -28 46, -16 30, -6 38"
          fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Main body -->
    <ellipse cx="0" cy="20" rx="41" ry="37" fill="url(#finch-body)"/>
    <!-- Yellow breast -->
    <ellipse cx="12" cy="24" rx="25" ry="28" fill="url(#finch-breast)"/>
    <!-- Head -->
    <circle cx="16" cy="-28" r="26" fill="url(#finch-body)"/>
    <!-- Yellow cheek patch -->
    <ellipse cx="28" cy="-22" rx="12" ry="9" fill="#fde047" opacity="0.75"/>
    <!-- Eye -->
    <circle cx="26" cy="-34" r="8" fill="#f9fbe7"/>
    <circle cx="27" cy="-34" r="5.5" fill="#052e16"/>
    <circle cx="29" cy="-37" r="2.5" fill="url(#eye-shine)"/>
    <!-- Beak upper (seed-cracker, slightly chunkier) -->
    <path d="M 38 -34 L 64 -26 L 38 -18 Z" fill="#ca8a04"/>
    <path d="M 38 -18 L 62 -12 L 38 -10 Z" fill="#a16207" opacity="0.8"/>
    <!-- Legs -->
    <line x1="-8"  y1="58" x2="-10" y2="90" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="90" x2="-22" y2="100" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="90" x2="-4"  y2="102" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8"  y1="58"  x2="10"  y2="90" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="90"  x2="-2"  y2="102" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="90"  x2="22"  y2="100" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Label -->
  <text x="1000" y="380" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold"
        fill="#4ade80" letter-spacing="0.5">Forest Finch</text>
</svg>
