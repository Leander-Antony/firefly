<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="kitkat-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="choc-kitkat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="40%" stop-color="#7c2d12"/>
      <stop offset="80%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>

    <linearGradient id="kitkat-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="silver-foil-kitkat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64et8b"/>
    </linearGradient>
  </defs>

  <g filter="url(#kitkat-shadow)" transform="translate(10, 0)">
    <!-- KitKat Bar (4 Wafer Fingers) -->
    <g transform="rotate(-15 256 256)">
      <!-- 4 Wafer Fingers Base Chocolate -->
      <g stroke="#1c0a00" stroke-width="2">
        <!-- Finger 1 -->
        <rect x="175" y="110" width="36" height="290" rx="4" fill="url(#choc-kitkat)"/>
        <!-- Finger 2 -->
        <rect x="215" y="110" width="36" height="290" rx="4" fill="url(#choc-kitkat)"/>
        <!-- Finger 3 -->
        <rect x="255" y="110" width="36" height="290" rx="4" fill="url(#choc-kitkat)"/>
        <!-- Finger 4 -->
        <rect x="295" y="110" width="36" height="290" rx="4" fill="url(#choc-kitkat)"/>
      </g>

      <!-- KitKat Stamp Lines on top of each finger -->
      <g opacity="0.6">
        <rect x="181" y="125" width="24" height="60" fill="#78350f"/>
        <rect x="221" y="125" width="24" height="60" fill="#78350f"/>
        <rect x="261" y="125" width="24" height="60" fill="#78350f"/>
      </g>

      <!-- BITE MARK Out of Finger 4 Top Right Corner -->
      <path d="M 290 105 C 280 120, 275 135, 295 145 C 315 155, 330 140, 340 155 L 340 105 Z" fill="#ffffff"/>

      <!-- Silver Foil Wrapper Peeled Down -->
      <path d="M 160 220 L 175 195 L 256 235 L 335 185 L 350 215 L 350 410 L 160 410 Z" fill="url(#silver-foil-kitkat)" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Iconic Red KitKat Wrapper Base -->
      <rect x="160" y="240" width="190" height="170" rx="4" fill="url(#kitkat-red)" stroke="#7f1d1d" stroke-width="2"/>

      <!-- White Oval KitKat Logo Badge -->
      <ellipse cx="255" cy="325" rx="70" ry="40" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
      
      <!-- Iconic Red "KitKat" Text -->
      <text x="255" y="336" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#dc2626" font-style="italic">KitKat</text>
    </g>
  </g>
</svg>
