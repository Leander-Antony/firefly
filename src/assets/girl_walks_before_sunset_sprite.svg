<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Glow & Bloom Filters -->
    <filter id="pastel-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="rim-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pastel Cloak Gradients (Transparent-friendly sunset colors) -->
    <linearGradient id="pastel-cloak-main" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffe6eb"/>
      <stop offset="25%" stop-color="#ffb7c5"/>
      <stop offset="60%" stop-color="#d8b4f8"/>
      <stop offset="90%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <linearGradient id="cloak-inner-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d98099"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#3c096c"/>
    </linearGradient>

    <linearGradient id="sunset-rim-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="50%" stop-color="#ffab73"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>

    <linearGradient id="girl-body-silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1537"/>
      <stop offset="50%" stop-color="#190a21"/>
      <stop offset="100%" stop-color="#0b030f"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow (Soft transparent shadow underneath sprite) -->
  <ellipse cx="256" cy="455" rx="85" ry="12" fill="#120617" opacity="0.35" filter="url(#rim-bloom)"/>

  <g transform="translate(10, 0)">
    <!-- ================= 1. PASTEL CLOAK (BACKGROUND FLOWING LAYER) ================= -->
    <!-- Outer Flowing Cloak Spread (Trailing gracefully behind as she walks) -->
    <path d="M 240 140 
             C 190 170, 130 220, 90 310 
             C 125 330, 175 320, 205 295 
             C 160 345, 115 390, 135 435 
             C 185 425, 230 375, 260 325 
             C 275 260, 270 190, 255 140 Z" 
          fill="url(#pastel-cloak-main)" stroke="#ffd6e0" stroke-width="1.5" filter="url(#rim-bloom)"/>

    <!-- Cloak Inner Fold Shadows -->
    <path d="M 240 140 C 205 200, 175 270, 135 435 C 170 395, 210 340, 235 265 Z" fill="url(#cloak-inner-shade)" opacity="0.6"/>

    <!-- Vibrant Sunset Rim Highlight on Cloak Back Edges -->
    <path d="M 240 140 C 190 170, 130 220, 90 310 C 125 330, 175 320, 205 295" fill="none" stroke="url(#sunset-rim-glow)" stroke-width="3" filter="url(#pastel-glow)" opacity="0.95"/>
    <path d="M 205 295 C 160 345, 115 390, 135 435" fill="none" stroke="#ffb7c5" stroke-width="2.5" filter="url(#pastel-glow)" opacity="0.9"/>

    <!-- ================= 2. GIRL SILHOUETTE BODY & DRESS ================= -->
    <!-- Main Body & Dress Silhouette (Graceful walking pose) -->
    <path d="M 255 135 
             C 245 170, 240 220, 235 290 
             C 230 350, 225 410, 220 440 
             L 238 450 L 250 435 
             C 260 380, 268 310, 272 240 
             C 275 190, 270 155, 262 135 Z" 
          fill="url(#girl-body-silhouette)"/>

    <!-- Graceful Feet / Stride -->
    <!-- Back Foot (Stepping back under cloak hem) -->
    <path d="M 215 425 Q 205 438, 195 442 Q 210 445, 222 432 Z" fill="#0b030f"/>
    <!-- Front Foot (Stepping forward) -->
    <path d="M 242 435 Q 252 445, 265 448 Q 260 452, 240 446 Z" fill="#0b030f"/>

    <!-- Slender Arms & Cloak Hold -->
    <path d="M 255 160 Q 240 200, 248 230 Q 256 225, 260 195 Z" fill="#1e0b24"/>

    <!-- Head & Flowing Hair (3/4 Back Profile View) -->
    <!-- Soft Hair Tresses Blowing in Wind -->
    <path d="M 245 95 C 220 108, 195 125, 175 145 C 198 140, 225 128, 245 118 Z" fill="url(#cloak-inner-shade)"/>
    <path d="M 175 145 C 198 140, 225 128, 245 118" stroke="#ffb7c5" stroke-width="2" fill="none" opacity="0.8" filter="url(#rim-bloom)"/>

    <!-- Head & Neck Silhouette -->
    <circle cx="254" cy="105" r="15" fill="url(#girl-body-silhouette)"/>
    <path d="M 250 120 L 258 120 L 256 135 L 248 135 Z" fill="url(#girl-body-silhouette)"/>

    <!-- Sunset Rim Lighting on Hair Profile -->
    <path d="M 242 95 C 248 90, 258 90, 264 96 C 256 102, 250 110, 246 122" stroke="#fff1b5" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#pastel-glow)"/>

    <!-- ================= 3. FLOATING SUNSET DUST & MAGIC MOTES ================= -->
    <g filter="url(#pastel-glow)">
      <!-- Glowing Firefly Motes surrounding her -->
      <circle cx="160" cy="220" r="4.5" fill="#fff5c0" opacity="0.9"/>
      <circle cx="110" cy="330" r="3.5" fill="#ffb7c5" opacity="0.85"/>
      <circle cx="280" cy="180" r="4" fill="#ffd1dc" opacity="0.9"/>
      <circle cx="220" cy="370" r="3" fill="#ffe5ec" opacity="0.85"/>
      <circle cx="285" cy="340" r="3.5" fill="#fff2a3" opacity="0.9"/>
      <circle cx="200" cy="110" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="130" cy="420" r="3" fill="#ffab73" opacity="0.8"/>

      <!-- Floating Leaf Petals -->
      <path d="M 140 180 Q 152 170, 155 185 Q 143 190, 140 180 Z" fill="#ffb7c5" opacity="0.85"/>
      <path d="M 285 270 Q 296 260, 298 274 Q 287 278, 285 270 Z" fill="#ffd1dc" opacity="0.9"/>
      <path d="M 100 270 Q 110 262, 112 275 Q 102 278, 100 270 Z" fill="#ff758f" opacity="0.75"/>
    </g>
  </g>
</svg>
