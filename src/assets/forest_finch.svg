<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="soft-glow-finch" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="finch-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="finch-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="finch-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="finch-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <g filter="url(#soft-glow-finch)" transform="translate(10, 20)">
    <!-- ================= STANDALONE FOREST FINCH BIRD ================= -->
    <!-- Dark Feet -->
    <path d="M 235 348 L 228 375 M 235 348 L 235 378 M 235 348 L 244 374" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 265 342 L 258 368 M 265 342 L 265 372 M 265 342 L 274 367" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Tail Feathers -->
    <path d="M 160 300 L 90 350 L 110 362 L 180 320 Z" fill="url(#finch-wing)"/>
    <polygon points="90,350 75,362 100,358" fill="#facc15"/>

    <!-- Back Body (Emerald Green) -->
    <path d="M 210 160 
             C 170 190, 160 260, 180 315 
             C 210 335, 270 345, 300 320 
             C 330 280, 310 210, 270 165 
             C 245 140, 225 145, 210 160 Z" 
          fill="url(#finch-emerald)"/>

    <!-- Vibrant Yellow Chest & Belly -->
    <path d="M 245 160 
             C 285 180, 320 220, 305 285 
             C 280 305, 240 300, 220 270 
             C 210 230, 220 180, 245 160 Z" 
          fill="url(#finch-yellow)"/>

    <!-- Soft White Vent -->
    <path d="M 220 300 C 240 335, 285 330, 300 315 C 290 280, 260 290, 220 300 Z" fill="url(#finch-belly)"/>

    <!-- Wing Layer -->
    <path d="M 205 200 
             C 185 240, 175 285, 225 325 
             C 255 320, 240 270, 220 230 
             C 212 215, 210 205, 205 200 Z" 
          fill="url(#finch-wing)"/>
    <!-- Yellow Wing Bars -->
    <path d="M 200 220 C 190 250, 190 285, 220 315" stroke="#facc15" stroke-width="3" fill="none"/>
    <path d="M 212 230 C 205 260, 205 290, 230 318" stroke="#34d399" stroke-width="2" fill="none"/>

    <!-- Head & Mask -->
    <path d="M 210 160 C 220 130, 260 125, 280 150 C 275 170, 245 170, 210 160 Z" fill="url(#finch-yellow)"/>
    <path d="M 245 145 C 255 140, 275 145, 280 155 C 270 162, 255 160, 245 145 Z" fill="#064e3b"/>

    <!-- Eye -->
    <circle cx="258" cy="150" r="8.5" fill="#ffffff"/>
    <circle cx="258" cy="150" r="5.5" fill="#022c22"/>
    <circle cx="260" cy="148" r="2" fill="#ffffff"/>

    <!-- Seed-cracking Beak -->
    <polygon points="278,145 318,154 276,164" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  </g>
</svg>
