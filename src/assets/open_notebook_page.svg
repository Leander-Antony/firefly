<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="notebook-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="cover-leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="page-paper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>

  <g filter="url(#notebook-shadow)" transform="translate(10, 20)">
    <!-- Hardcover Backing Base -->
    <rect x="50" y="70" width="412" height="340" rx="10" fill="url(#cover-leather)"/>

    <!-- Open Paper Pages (Left & Right Spreads) -->
    <rect x="60" y="80" width="392" height="320" rx="6" fill="url(#page-paper)"/>

    <!-- Center Spine Crease Shadow -->
    <rect x="250" y="80" width="12" height="320" fill="#cbd5e1" opacity="0.6"/>
    <line x1="256" y1="80" x2="256" y2="400" stroke="#94a3b8" stroke-width="2"/>

    <!-- Red Satin Ribbon Bookmark hanging down center -->
    <path d="M 254 80 L 254 430 L 262 415 L 270 430 L 270 80 Z" fill="#ef4444"/>

    <!-- Lined Paper Rules (Horizontal Blue Lines on Left & Right) -->
    <g stroke="#93c5fd" stroke-width="1.5" opacity="0.6">
      <!-- Left Page Lines -->
      <line x1="80" y1="130" x2="236" y2="130"/>
      <line x1="80" y1="160" x2="236" y2="160"/>
      <line x1="80" y1="190" x2="236" y2="190"/>
      <line x1="80" y1="220" x2="236" y2="220"/>
      <line x1="80" y1="250" x2="236" y2="250"/>
      <line x1="80" y1="280" x2="236" y2="280"/>
      <line x1="80" y1="310" x2="236" y2="310"/>
      <line x1="80" y1="340" x2="236" y2="340"/>
      <line x1="80" y1="370" x2="236" y2="370"/>

      <!-- Right Page Lines -->
      <line x1="276" y1="130" x2="432" y2="130"/>
      <line x1="276" y1="160" x2="432" y2="160"/>
      <line x1="276" y1="190" x2="432" y2="190"/>
      <line x1="276" y1="220" x2="432" y2="220"/>
      <line x1="276" y1="250" x2="432" y2="250"/>
      <line x1="276" y1="280" x2="432" y2="280"/>
      <line x1="276" y1="310" x2="432" y2="310"/>
      <line x1="276" y1="340" x2="432" y2="340"/>
      <line x1="276" y1="370" x2="432" y2="370"/>
    </g>

    <!-- Margin Vertical Red Lines -->
    <line x1="105" y1="80" x2="105" y2="400" stroke="#fca5a5" stroke-width="1.5"/>
    <line x1="407" y1="80" x2="407" y2="400" stroke="#fca5a5" stroke-width="1.5"/>

    <!-- Hand-written Inscribed Text: "Let's learn together" -->
    <g>
      <!-- Cursive / Elegant Handwritten Style Text -->
      <text x="354" y="215" text-anchor="middle" font-family="'Brush Script MT', 'Georgia', cursive, serif" font-style="italic" font-weight="bold" font-size="28" fill="#1e1b4b">Let's learn</text>
      <text x="354" y="275" text-anchor="middle" font-family="'Brush Script MT', 'Georgia', cursive, serif" font-style="italic" font-weight="bold" font-size="32" fill="#4338ca">together ✨</text>
    </g>

    <!-- Left Page Doodle Sketch (Little Star & Heart) -->
    <path d="M 140 180 Q 150 170 160 180 Q 170 190 150 205 Q 130 190 140 180 Z" fill="#ec4899" opacity="0.8"/>
  </g>
</svg>
