<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="empty-bench-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="bench-wood-icon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="bench-legs-icon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g filter="url(#empty-bench-shadow)" transform="translate(10, 30)">
    <!-- Standalone Empty Bench Contact Shadow -->
    <ellipse cx="256" cy="425" rx="180" ry="16" fill="#0f172a" opacity="0.3"/>

    <!-- Wrought Iron Legs & Armrests -->
    <!-- Left Leg Pair -->
    <path d="M 120 320 L 105 420 M 120 320 L 135 420 M 105 420 L 135 420" stroke="url(#bench-legs-icon)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 100 300 C 85 280, 95 240, 115 240 L 125 320" stroke="url(#bench-legs-icon)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Right Leg Pair -->
    <path d="M 390 320 L 375 420 M 390 320 L 405 420 M 375 420 L 405 420" stroke="url(#bench-legs-icon)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 410 300 C 425 280, 415 240, 395 240 L 385 320" stroke="url(#bench-legs-icon)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Wooden Backrest Slats -->
    <g>
      <rect x="110" y="220" width="292" height="16" rx="3" fill="url(#bench-wood-icon)" stroke="#270e02" stroke-width="1.5"/>
      <rect x="110" y="242" width="292" height="16" rx="3" fill="url(#bench-wood-icon)" stroke="#270e02" stroke-width="1.5"/>
      <rect x="110" y="264" width="292" height="16" rx="3" fill="url(#bench-wood-icon)" stroke="#270e02" stroke-width="1.5"/>
      <rect x="110" y="286" width="292" height="16" rx="3" fill="url(#bench-wood-icon)" stroke="#270e02" stroke-width="1.5"/>
    </g>

    <!-- Wooden Seat Slats -->
    <g>
      <polygon points="95,315 417,315 425,329 87,329" fill="#d97706" stroke="#270e02" stroke-width="1.5"/>
      <polygon points="87,331 425,331 433,345 79,345" fill="#fbbf24" stroke="#270e02" stroke-width="1.5"/>
      <polygon points="79,347 433,347 440,361 72,361" fill="#d97706" stroke="#270e02" stroke-width="1.5"/>
    </g>

    <!-- Iron Wrought Scroll Ornaments on Backrest -->
    <path d="M 140 230 C 155 215, 175 215, 190 230" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M 320 230 C 335 215, 355 215, 370 230" stroke="#475569" stroke-width="3" fill="none"/>
  </g>
</svg>
