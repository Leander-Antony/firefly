<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brass gradient for the eyepiece ring -->
    <linearGradient id="brass-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff5c0"/>
      <stop offset="20%"  stop-color="#fde047"/>
      <stop offset="45%"  stop-color="#d97706"/>
      <stop offset="70%"  stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Inner thin accent ring -->
    <linearGradient id="brass-inner-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fef08a"/>
      <stop offset="50%"  stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Glow filter for crosshairs & reticle -->
    <filter id="reticle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer drop shadow on the bezel -->
    <filter id="bezel-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Clip to the outer bezel circle -->
    <clipPath id="bezel-clip">
      <circle cx="256" cy="256" r="232"/>
    </clipPath>

    <!-- Mask that punches a transparent hole in the centre -->
    <mask id="ring-mask">
      <rect width="512" height="512" fill="white"/>
      <!-- transparent hole — radius 178 leaves 20px for the inner accent ring -->
      <circle cx="256" cy="256" r="178" fill="black"/>
    </mask>
  </defs>

  <!-- ── OUTER BRASS BEZEL RING (solid, with hole punched) ── -->
  <g filter="url(#bezel-shadow)">
    <!-- Wide outer ring filled with brass gradient, hole masked out -->
    <circle cx="256" cy="256" r="232" fill="url(#brass-ring-grad)" mask="url(#ring-mask)"/>
    <!-- Dark separator channel between outer and inner ring -->
    <circle cx="256" cy="256" r="202" fill="none" stroke="#1c1003" stroke-width="6" mask="url(#ring-mask)"/>
    <!-- Inner thin brass accent ring -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="url(#brass-inner-grad)" stroke-width="14" mask="url(#ring-mask)"/>
  </g>

  <!-- ── COMPASS LETTERS on Outer Brass Bezel ── -->
  <text x="256" y="40"  text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#1c1003" letter-spacing="1">N 0°</text>
  <text x="256" y="482" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#1c1003" letter-spacing="1">S 180°</text>
  <text x="474" y="263" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#1c1003" letter-spacing="1">E</text>
  <text x="38"  y="263" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#1c1003" letter-spacing="1">W</text>

  <!-- ── TICK MARKS around inner edge of bezel ── -->
  <g stroke="#ca8a04" stroke-width="2" opacity="0.7">
    <circle cx="256" cy="256" r="183" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3 7"/>
  </g>

  <!-- ── RETICLE CROSSHAIRS (brass, glow) — rendered over the transparent hole ── -->
  <g filter="url(#reticle-glow)" stroke="url(#brass-ring-grad)" stroke-width="1.2" opacity="0.75">
    <!-- Horizontal crosshair, gap at centre -->
    <line x1="84"  y1="256" x2="228" y2="256"/>
    <line x1="284" y1="256" x2="428" y2="256"/>
    <!-- Vertical crosshair, gap at centre -->
    <line x1="256" y1="84"  x2="256" y2="228"/>
    <line x1="256" y1="284" x2="256" y2="428"/>
  </g>

  <!-- ── CENTRE RETICLE RINGS & DOT ── -->
  <g filter="url(#reticle-glow)">
    <circle cx="256" cy="256" r="30"  fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.85"/>
    <circle cx="256" cy="256" r="60"  fill="none" stroke="#fde047" stroke-width="0.8" opacity="0.45" stroke-dasharray="4 6"/>
    <circle cx="256" cy="256" r="5"   fill="#fde047" opacity="0.9"/>
  </g>

  <!-- ── METALLIC SHEEN ARC on outer bezel highlight ── -->
  <path d="M 100 100 C 160 48, 352 48, 412 100 C 356 72, 156 72, 100 100 Z" fill="#ffffff" opacity="0.22" clip-path="url(#bezel-clip)"/>
</svg>
