<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Viewfinder Glow Filter -->
    <filter id="telescope-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="15" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="viewfinder-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#020617" flood-opacity="0.8"/>
    </filter>

    <!-- Metallic & Lens Gradients -->
    <linearGradient id="brass-eyepiece-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <radialGradient id="viewfinder-space" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <g filter="url(#viewfinder-shadow)" transform="translate(0, 0)">
    <!-- Outer Heavy Brass Eyepiece Ring -->
    <circle cx="256" cy="256" r="230" fill="url(#brass-eyepiece-ring)"/>
    <circle cx="256" cy="256" r="208" fill="#1e1003"/>
    <circle cx="256" cy="256" r="198" fill="url(#brass-eyepiece-ring)"/>

    <!-- Inner Viewfinder Space Aperture Window -->
    <circle cx="256" cy="256" r="180" fill="url(#viewfinder-space)"/>

    <!-- Lens Flare Blue Glass Ring -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5" filter="url(#telescope-glow)"/>

    <!-- ================= CONSTELLATION STARS & NEBULA INSIDE ================= -->
    <g filter="url(#telescope-glow)">
      <!-- Constellation Line 1 (Ursa Major / Dipper motif) -->
      <polyline points="140,160 170,180 200,175 230,200 270,195 290,225 250,230 230,200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
      
      <!-- Constellation Star Nodes -->
      <circle cx="140" cy="160" r="4.5" fill="#ffffff"/>
      <circle cx="170" cy="180" r="3.5" fill="#fde047"/>
      <circle cx="200" cy="175" r="4" fill="#ffffff"/>
      <circle cx="230" cy="200" r="4" fill="#38bdf8"/>
      <circle cx="270" cy="195" r="4.5" fill="#ffffff"/>
      <circle cx="290" cy="225" r="5" fill="#fde047"/>
      <circle cx="250" cy="230" r="4" fill="#ffffff"/>

      <!-- Random Deep Space Stars & 4-Point Sparkles -->
      <polygon points="340,140 343,148 351,151 343,154 340,162 337,154 329,151 337,148" fill="#ffffff"/>
      <polygon points="160,300 162,305 167,307 162,309 160,314 158,309 153,307 158,305" fill="#fde047"/>
      <polygon points="320,310 322,314 326,316 322,318 320,322 318,318 314,316 318,314" fill="#ffffff"/>

      <circle cx="180" cy="240" r="2" fill="#ffffff"/>
      <circle cx="360" cy="240" r="3" fill="#38bdf8"/>
      <circle cx="220" cy="330" r="2.5" fill="#ffffff"/>
      <circle cx="290" cy="340" r="3.5" fill="#fde047"/>
      <circle cx="140" cy="220" r="2.5" fill="#ffffff"/>
    </g>

    <!-- ================= BRASS RETICLE CROSSHAIRS & MEASUREMENT TICKS ================= -->
    <!-- Fine Crosshairs Lines -->
    <g stroke="url(#brass-eyepiece-ring)" stroke-width="1.5" opacity="0.85">
      <!-- Horizontal Crosshair with Center Gap -->
      <line x1="80" y1="256" x2="230" y2="256"/>
      <line x1="282" y1="256" x2="432" y2="256"/>
      <!-- Vertical Crosshair with Center Gap -->
      <line x1="256" y1="80" x2="256" y2="230"/>
      <line x1="256" y1="282" x2="256" y2="432"/>

      <!-- Center Targeting Reticle Rings -->
      <circle cx="256" cy="256" r="26" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.9"/>
      <circle cx="256" cy="256" r="4" fill="#fde047" opacity="0.9"/>

      <!-- Outer Degree Measurement Ticks around Rim (360° Ticks) -->
      <circle cx="256" cy="256" r="185" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="2,6"/>
    </g>

    <!-- Compass Degree Markings (N, S, E, W) on Brass Ring -->
    <text x="256" y="96" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#451a03">N 0°</text>
    <text x="256" y="424" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#451a03">S 180°</text>
    <text x="420" y="261" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#451a03">E 90°</text>
    <text x="92" y="261" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#451a03">W 270°</text>

    <!-- Metallic Reflection Arc on Outer Bezel -->
    <path d="M 120 120 C 180 60, 332 60, 392 120 C 340 85, 172 85, 120 120 Z" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
