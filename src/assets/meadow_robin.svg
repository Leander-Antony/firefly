<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="soft-glow-robin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1c1917" flood-opacity="0.3"/>
    </filter>

    <!-- Gradients for Meadow Robin -->
    <linearGradient id="robin-breast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="robin-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#543310"/>
      <stop offset="100%" stop-color="#361a05"/>
    </linearGradient>

    <linearGradient id="robin-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>

    <linearGradient id="robin-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <g filter="url(#soft-glow-robin)" transform="translate(10, 20)">
    <!-- ================= STANDALONE MEADOW ROBIN BIRD ================= -->
    <!-- Bird Feet -->
    <path d="M 235 348 L 228 375 M 235 348 L 235 378 M 235 348 L 244 374" stroke="#361a05" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 268 342 L 261 368 M 268 342 L 268 372 M 268 342 L 277 367" stroke="#361a05" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Tail Feathers -->
    <path d="M 160 300 L 80 365 L 102 378 L 180 320 Z" fill="url(#robin-wing)"/>
    <path d="M 150 310 L 70 380 L 88 388 L 165 325 Z" fill="#361a05"/>

    <!-- Back & Head Body Base -->
    <path d="M 210 150 
             C 170 180, 160 250, 180 315 
             C 210 335, 270 345, 300 320 
             C 330 280, 310 200, 270 155 
             C 245 130, 225 135, 210 150 Z" 
          fill="url(#robin-back)"/>

    <!-- Cream Lower Belly -->
    <path d="M 220 300 C 240 335, 285 330, 300 315 C 290 280, 260 290, 220 300 Z" fill="url(#robin-belly)"/>

    <!-- Bright Terracotta / Orange Breast -->
    <path d="M 245 150 
             C 285 170, 320 210, 305 275 
             C 280 295, 240 290, 220 260 
             C 210 220, 220 170, 245 150 Z" 
          fill="url(#robin-breast)"/>

    <!-- Folded Wing Layer -->
    <path d="M 205 190 
             C 185 230, 175 275, 225 315 
             C 255 310, 240 260, 220 220 
             C 212 205, 210 195, 205 190 Z" 
          fill="url(#robin-wing)"/>
    
    <!-- Wing Feather Detail Lines -->
    <path d="M 200 210 C 190 240, 190 275, 220 305" stroke="#a16207" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 212 220 C 205 250, 205 280, 230 308" stroke="#a16207" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Head & Crown -->
    <path d="M 210 150 C 220 120, 260 115, 280 140 C 275 160, 245 160, 210 150 Z" fill="url(#robin-back)"/>

    <!-- Eye & Eye Ring -->
    <circle cx="258" cy="142" r="9" fill="#ffffff"/>
    <circle cx="258" cy="142" r="6" fill="#1c1917"/>
    <circle cx="260" cy="140" r="2" fill="#ffffff"/>

    <!-- Sharp Beak -->
    <polygon points="280,140 320,150 278,156" fill="#facc15" stroke="#854d0e" stroke-width="1.5"/>

    <!-- Subtle Feather Highlights -->
    <path d="M 255 165 Q 275 185 280 210" stroke="#ffedd5" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
</svg>
