<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Starlight Glow Filter -->
    <filter id="star-glow-bluebird" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bluebird-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="bluebird-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bluebird-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <g filter="url(#star-glow-bluebird)" transform="translate(10, 20)">
    <!-- ================= STANDALONE STARLIGHT BLUEBIRD ================= -->
    <!-- Silver Feet -->
    <path d="M 235 340 L 228 368 M 235 340 L 235 372 M 235 340 L 244 367" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 265 334 L 258 360 M 265 334 L 265 364 M 265 334 L 274 360" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Tail Feathers -->
    <path d="M 170 290 L 85 350 L 105 362 L 185 310 Z" fill="url(#bluebird-wing)"/>
    <polygon points="85,350 70,365 95,360" fill="#38bdf8" filter="url(#star-glow-bluebird)"/>
    <polygon points="105,362 90,378 112,370" fill="#7dd3fc" filter="url(#star-glow-bluebird)"/>

    <!-- Main Body Base -->
    <path d="M 210 150 
             C 170 180, 160 250, 180 305 
             C 210 325, 270 335, 300 310 
             C 330 270, 310 200, 270 155 
             C 245 130, 225 135, 210 150 Z" 
          fill="url(#bluebird-back)"/>

    <!-- Luminous Cyan & Sky Blue Belly -->
    <path d="M 240 155 
             C 280 175, 315 215, 300 275 
             C 275 295, 235 290, 215 260 
             C 205 220, 215 175, 240 155 Z" 
          fill="url(#bluebird-belly)"/>

    <!-- Wings with Starlight Feather Motifs -->
    <path d="M 200 190 
             C 180 230, 170 275, 220 315 
             C 250 310, 235 260, 215 220 
             C 208 205, 205 195, 200 190 Z" 
          fill="url(#bluebird-wing)"/>
    
    <!-- Wing Starlight Lines & Stars -->
    <path d="M 195 210 Q 185 240 215 300" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.8"/>
    <polygon points="205,225 208,232 215,235 208,238 205,245 202,238 195,235 202,232" fill="#ffffff" filter="url(#star-glow-bluebird)"/>
    <polygon points="218,260 220,265 225,267 220,269 218,274 216,269 211,267 216,265" fill="#bae6fd" filter="url(#star-glow-bluebird)"/>

    <!-- Head & Crown -->
    <path d="M 210 150 C 220 120, 260 115, 280 140 C 275 160, 245 160, 210 150 Z" fill="url(#bluebird-back)"/>
    <path d="M 220 125 Q 210 110 205 95 Q 220 110 230 120 Z" fill="#60a5fa" filter="url(#star-glow-bluebird)"/>

    <!-- Eye -->
    <circle cx="258" cy="142" r="9" fill="#ffffff"/>
    <circle cx="258" cy="142" r="6" fill="#0f172a"/>
    <circle cx="260" cy="140" r="2.5" fill="#7dd3fc" filter="url(#star-glow-bluebird)"/>

    <!-- Beak -->
    <polygon points="280,140 320,150 278,156" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Floating Starlight Sparks -->
    <g filter="url(#star-glow-bluebird)">
      <polygon points="140,180 143,188 151,191 143,194 140,202 137,194 129,191 137,188" fill="#ffffff"/>
      <polygon points="340,160 342,165 347,167 342,169 340,174 338,169 333,167 338,165" fill="#7dd3fc"/>
      <polygon points="320,280 322,284 326,286 322,288 320,292 318,288 314,286 318,284" fill="#ffffff"/>
      <circle cx="160" cy="120" r="3.5" fill="#7dd3fc"/>
      <circle cx="360" cy="220" r="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
