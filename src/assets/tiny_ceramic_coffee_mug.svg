<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="steam-glow-mug" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mug-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="ceramic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef3c7"/>
      <stop offset="85%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="coffee-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>
  </defs>

  <g filter="url(#mug-drop-shadow)" transform="translate(10, 10)">
    <!-- Contact Shadow -->
    <ellipse cx="256" cy="410" rx="110" ry="18" fill="#1c1917" opacity="0.25"/>

    <!-- Handle -->
    <path d="M 330 260 C 390 260, 390 350, 330 350" stroke="url(#ceramic-grad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M 330 260 C 390 260, 390 350, 330 350" stroke="#d97706" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Ceramic Mug Body -->
    <path d="M 170 210 
             L 340 210 
             C 335 340, 320 400, 256 400 
             C 192 400, 177 340, 170 210 Z" 
          fill="url(#ceramic-grad)" stroke="#d97706" stroke-width="2"/>

    <!-- Inner Coffee Surface & Rim -->
    <ellipse cx="255" cy="210" rx="85" ry="25" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="255" cy="210" rx="76" ry="20" fill="url(#coffee-liquid)"/>
    <ellipse cx="255" cy="210" rx="66" ry="14" fill="#a16207" opacity="0.3"/>

    <!-- Faint Tally Marks Carved on Side -->
    <g stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <!-- 4 Vertical Lines -->
      <line x1="220" y1="280" x2="222" y2="330"/>
      <line x1="236" y1="280" x2="238" y2="330"/>
      <line x1="252" y1="280" x2="254" y2="330"/>
      <line x1="268" y1="280" x2="270" y2="330"/>
      <!-- Diagonal Cross Tally Line -->
      <line x1="210" y1="320" x2="280" y2="290" stroke="#b45309" stroke-width="4.5"/>
    </g>

    <!-- Rising Steaming Aromatic Curls -->
    <g filter="url(#steam-glow-mug)" opacity="0.75">
      <path d="M 220 180 Q 205 140 220 100 Q 235 60 220 30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 255 180 Q 270 140 255 100 Q 240 60 255 30" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 290 180 Q 280 140 290 100 Q 300 60 290 30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
