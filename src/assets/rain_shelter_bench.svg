<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow Filter -->
    <filter id="standalone-bench-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bench-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="iron-bench-legs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="wet-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g filter="url(#standalone-bench-shadow)" transform="translate(10, 30)">
    <!-- ================= STANDALONE WOODEN PARK BENCH ================= -->
    <!-- Soft Contact Shadow on Ground -->
    <ellipse cx="256" cy="445" rx="190" ry="18" fill="#0f172a" opacity="0.25"/>

    <!-- Wrought Iron Legs & Armrests -->
    <!-- Left Leg Pair -->
    <path d="M 120 340 L 105 440 M 120 340 L 135 440 M 105 440 L 135 440" stroke="url(#iron-bench-legs)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 100 320 C 85 300, 95 260, 115 260 L 125 340" stroke="url(#iron-bench-legs)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Right Leg Pair -->
    <path d="M 390 340 L 375 440 M 390 340 L 405 440 M 375 440 L 405 440" stroke="url(#iron-bench-legs)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 410 320 C 425 300, 415 260, 395 260 L 385 340" stroke="url(#iron-bench-legs)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Wooden Backrest Slats (Horizontal Planks) -->
    <g>
      <rect x="110" y="240" width="292" height="16" rx="3" fill="url(#bench-wood)" stroke="#270e02" stroke-width="1.5"/>
      <rect x="110" y="262" width="292" height="16" rx="3" fill="url(#bench-wood)" stroke="#270e02" stroke-width="1.5"/>
      <rect x="110" y="284" width="292" height="16" rx="3" fill="url(#bench-wood)" stroke="#270e02" stroke-width="1.5"/>
      <rect x="110" y="306" width="292" height="16" rx="3" fill="url(#bench-wood)" stroke="#270e02" stroke-width="1.5"/>

      <!-- Rain Wet Sheen Highlight Lines on Planks -->
      <line x1="120" y1="242" x2="390" y2="242" stroke="url(#wet-sheen)" stroke-width="2"/>
      <line x1="120" y1="264" x2="390" y2="264" stroke="url(#wet-sheen)" stroke-width="2"/>
      <line x1="120" y1="286" x2="390" y2="286" stroke="url(#wet-sheen)" stroke-width="2"/>
    </g>

    <!-- Wooden Seat Slats (3D Angled Planks) -->
    <g>
      <polygon points="95,335 417,335 425,349 87,349" fill="#78350f" stroke="#270e02" stroke-width="1.5"/>
      <polygon points="87,351 425,351 433,365 79,365" fill="#a16207" stroke="#270e02" stroke-width="1.5"/>
      <polygon points="79,367 433,367 440,381 72,381" fill="#78350f" stroke="#270e02" stroke-width="1.5"/>

      <!-- Seat Wet Highlights -->
      <line x1="95" y1="337" x2="415" y2="337" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
      <line x1="87" y1="353" x2="423" y2="353" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Iron Wrought Scroll Ornaments on Backrest -->
    <path d="M 140 250 C 155 235, 175 235, 190 250" stroke="#475569" stroke-width="3" fill="none"/>
    <path d="M 320 250 C 335 235, 355 235, 370 250" stroke="#475569" stroke-width="3" fill="none"/>

    <!-- Subtle Water Drops on Edge -->
    <circle cx="105" cy="335" r="2.5" fill="#e0f2fe"/>
    <circle cx="408" cy="335" r="2.5" fill="#e0f2fe"/>
    <circle cx="75" cy="381" r="2.5" fill="#e0f2fe"/>
    <circle cx="438" cy="381" r="2.5" fill="#e0f2fe"/>
  </g>
</svg>
